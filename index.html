<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail Clon - Correo Temporal Gratis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f2f5; color: #333; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 800px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 20px; }
        h1 { text-align: center; color: #4a154b; margin-bottom: 20px; }
        
        /* Zona del correo generado */
        .email-box { display: flex; background: #f8f9fa; border: 2px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 20px; gap: 10px; }
        #email-address { flex: 1; font-size: 1.1rem; font-weight: bold; border: none; background: transparent; outline: none; color: #2d3748; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 6px; transition: background 0.2s; font-weight: bold; }
        .btn-primary { background-color: #4a154b; color: white; }
        .btn-primary:hover { background-color: #631c64; }
        .btn-secondary { background-color: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background-color: #e2e8f0; }

        /* Controles y Bandeja de Entrada */
        .actions { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .inbox-container { border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .inbox-header { background: #4a154b; color: white; padding: 12px; font-weight: bold; display: grid; grid-template-columns: 2fr 3fr 1fr; }
        .mail-item { display: grid; grid-template-columns: 2fr 3fr 1fr; padding: 12px; border-bottom: 1px solid #edf2f7; cursor: pointer; transition: background 0.1s; }
        .mail-item:hover { background: #f7fafc; }
        .mail-item.unread { font-weight: bold; background: #f0fdf4; }
        
        /* Visor de contenido del correo */
        .mail-viewer { margin-top: 20px; padding: 20px; border: 2px dashed #cbd5e0; border-radius: 8px; background: #fff; display: none; }
        .mail-viewer h3 { margin-bottom: 10px; color: #4a154b; }
        .mail-body { margin-top: 15px; padding-top: 15px; border-top: 1px solid #e2e8f0; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Buzón de Correo Temporal</h1>
        
        <!-- Bloque de Visualización y Copiado -->
        <div class="email-box">
            <input type="text" id="email-address" readonly value="Generando correo...">
            <button class="btn btn-secondary" onclick="copiarAlPortapapeles()">Copiar</button>
        </div>

        <!-- Botones de Acción -->
        <div class="actions">
            <button class="btn btn-primary" onclick="actualizarBandeja()">🔄 Actualizar Bandeja</button>
            <button class="btn btn-secondary" onclick="generarNuevoCorreo()">Nuevo Correo</button>
        </div>

        <!-- Estructura de la Bandeja de Entrada -->
        <div class="inbox-container">
            <div class="inbox-header">
                <div>Remitente</div>
                <div>Asunto</div>
                <div>Acción</div>
            </div>
            <div id="inbox-list">
                <!-- Los correos entrantes se inyectarán aquí mediante JavaScript -->
            </div>
        </div>

        <!-- Visor del Correo Seleccionado -->
        <div id="mail-viewer" class="mail-viewer">
            <button class="btn btn-secondary" style="float: right;" onclick="cerrarVisor()">Cerrar</button>
            <h3 id="view-subject">Asunto del correo</h3>
            <p><strong>De:</strong> <span id="view-from"></span></p>
            <div id="view-body" class="mail-body">Contenido...</div>
        </div>
    </div>

    <script>
        // Configuración de la API externa de 1secmail
        const API_URL = "https://1secmail.com";
        let login = "";
        let domain = "";

        // Al cargar la página, se inicializa un correo aleatorio
        window.onload = () => {
            generarNuevoCorreo();
            // Polling: Actualiza automáticamente la bandeja cada 10 segundos
            setInterval(actualizarBandeja, 10000);
        };

        // 1. Lógica para generar un correo
        function generarNuevoCorreo() {
            document.getElementById('email-address').value = "Generando...";
            cerrarVisor();
            
            // Solicita a la API una dirección aleatoria
            fetch(`${API_URL}?action=genRandomMailbox&count=1`)
                .then(res => res.json())
                .then(data => {
                    const fullEmail = data[0];
                    document.getElementById('email-address').value = fullEmail;
                    
                    // Separa el usuario y el dominio requeridos por la API
                    const parts = fullEmail.split('@');
                    login = parts[0];
                    domain = parts[1];
                    
                    actualizarBandeja();
                })
                .catch(err => {
                    document.getElementById('email-address').value = "Error al generar";
                    console.error(err);
                });
        }

        // 2. Lógica para leer la bandeja de entrada
        function actualizarBandeja() {
            if (!login || !domain) return;
            const inboxList = document.getElementById('inbox-list');

            fetch(`${API_URL}?action=getMessages&login=${login}&domain=${domain}`)
                .then(res => res.json())
                .then(messages => {
                    inboxList.innerHTML = "";
                    if (messages.length === 0) {
                        inboxList.innerHTML = `<div style="padding: 20px; text-align: center; color: #a0aec0;">La bandeja está vacía. Esperando correos...</div>`;
                        return;
                    }

                    // Renderiza cada correo en la lista
                    messages.forEach(msg => {
                        const row = document.createElement('div');
                        row.className = 'mail-item';
                        row.onclick = () => verDetalleCorreo(msg.id);
                        row.innerHTML = `
                            <div>${msg.from}</div>
                            <div>${msg.subject}</div>
                            <div><button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.8rem;">Leer</button></div>
                        `;
                        inboxList.appendChild(row);
                    });
                });
        }

        // 3. Lógica para abrir y leer un correo específico
        function verDetalleCorreo(id) {
            fetch(`${API_URL}?action=readMessage&login=${login}&domain=${domain}&id=${id}`)
                .then(res => res.json())
                .then(mail => {
                    document.getElementById('view-subject').innerText = mail.subject;
                    document.getElementById('view-from').innerText = mail.from;
                    
                    // Si el correo viene en formato HTML usa body, si no, textBody
                    const content = mail.htmlBody ? mail.htmlBody : mail.textBody.replace(/\n/g, '<br>');
                    document.getElementById('view-body').innerHTML = content;
                    
                    document.getElementById('mail-viewer').style.display = 'block';
                    document.getElementById('mail-viewer').scrollIntoView({ behavior: 'smooth' });
                });
        }

        // Funciones auxiliares de la interfaz
        function copiarAlPortapapeles() {
            const emailInput = document.getElementById('email-address');
            emailInput.select();
            document.execCommand('copy');
            alert('¡Dirección de correo copiada al portapapeles!');
        }

        function cerrarVisor() {
            document.getElementById('mail-viewer').style.display = 'none';
        }
    </script>
</body>
</html>

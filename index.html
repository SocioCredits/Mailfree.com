<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostPigeon // Secure Temp-Comm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        body { font-family: 'Share Tech Mono', monospace; background-color: #030712; color: #00ff66; }
        .glow { text-shadow: 0 0 10px rgba(0, 255, 102, 0.5); }
        .glow-box { box-shadow: 0 0 20px rgba(0, 255, 102, 0.1); border: 1px solid rgba(0, 255, 102, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

    <!-- Header / Navbar -->
    <header class="w-full py-2 border-b border-green-500/20 flex justify-between items-center text-xs">
        <span class="font-bold glow tracking-widest">GHOST_PIGEON v2.6</span>
        <span id="nodeStatus" class="text-yellow-500 animate-pulse">● NODO_ACTIVO</span>
    </header>

    <!-- Main Container -->
    <main class="my-auto space-y-6 w-full">
        <div class="text-center space-y-2">
            <h1 class="text-xl font-bold glow">&gt; PROTOCOLO_EFÍMERO</h1>
            <p class="text-xs text-gray-400">Genera un cripto-alias temporal sin bandejas web públicas ni rastreo.</p>
        </div>

        <!-- Generador de Alias -->
        <div class="glow-box bg-black/90 rounded-xl p-4 space-y-4">
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-green-400 mb-1">Tu Dirección Cuántica:</label>
                <div class="flex">
                    <input type="text" id="cryptoAlias" readonly class="bg-zinc-900 border border-green-500/30 text-green-300 px-3 py-2 rounded-l w-full text-xs focus:outline-none" placeholder="Toca 'Generar'...">
                    <button onclick="generateAlias()" class="bg-green-900/50 hover:bg-green-800 border border-l-0 border-green-500/30 text-green-300 px-4 py-2 rounded-r text-xs uppercase font-bold transition active:scale-95">Crear</button>
                </div>
            </div>
            
            <div class="flex justify-between items-center text-[10px] text-gray-500">
                <span id="timerText">TTL: 10:00 min</span>
                <button onclick="copyAlias()" class="text-green-400 hover:underline">Copiar Alias</button>
            </div>
        </div>

        <!-- Buzón de Recepción Única -->
        <div class="bg-zinc-950 border border-green-500/10 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <span class="text-[10px] text-gray-400 uppercase tracking-wider">[ Bandeja Silenciosa ]</span>
                <span id="inboxStatus" class="text-[10px] text-yellow-500">Esperando datos...</span>
            </div>

            <div id="inboxDisplay" class="min-h-[100px] flex flex-col items-center justify-center text-center p-2 text-xs text-zinc-500">
                Ningún paquete interceptado.
            </div>
        </div>
    </main>

    <!-- Footer / Acciones Móviles -->
    <footer class="w-full pt-4 border-t border-green-500/20 flex flex-col gap-2">
        <button onclick="simulateIncoming()" class="w-full bg-green-500/10 hover:bg-green-500/20 border border-green-500/30 text-green-400 py-2.5 rounded-lg text-xs uppercase tracking-wider transition">
            Simular Mensaje Entrante
        </button>
        <p class="text-[9px] text-center text-zinc-600">Desplegado en GitHub Pages • Cifrado en Cliente</p>
    </footer>

    <script>
        const words = ["shadow", "cyber", "pigeon", "quantum", "neon", "ghost", "matrix", "flux", "zero", "node", "pulse", "hex", "delta", "core"];
        let timerInterval;

        function generateAlias() {
            let w1 = words[Math.floor(Math.random() * words.length)];
            let w2 = words[Math.floor(Math.random() * words.length)];
            let randNum = Math.floor(Math.random() * 9000) + 1000;
            
            const uniqueAddress = `${w1}.${w2}.${randNum}@ghost-pigeon.net`;
            document.getElementById('cryptoAlias').value = uniqueAddress;
            document.getElementById('inboxStatus').innerText = "Escuchando...";
            document.getElementById('inboxStatus').className = "text-[10px] text-green-400 animate-pulse";
            
            document.getElementById('inboxDisplay').innerHTML = `
                <span class="text-zinc-400 text-xs">Alias activo. Listo para recibir confirmaciones o códigos anónimos.</span>
            `;

            startTimer();
        }

        function copyAlias() {
            const aliasInput = document.getElementById('cryptoAlias');
            if(!aliasInput.value) {
                alert("Primero genera un alias.");
                return;
            }
            navigator.clipboard.writeText(aliasInput.value);
            alert("¡Cripto-alias copiado al portapapeles!");
        }

        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 600; // 10 minutos
            const timerDisplay = document.getElementById('timerText');
            
            timerInterval = setInterval(() => {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerDisplay.innerText = `TTL: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                timeLeft--;
                
                if (timeLeft < 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "TTL: EXPIRADO";
                    document.getElementById('cryptoAlias').value = "";
                    document.getElementById('inboxDisplay').innerHTML = `<span class="text-red-400">Alias autodestruido por tiempo límite.</span>`;
                }
            }, 1000);
        }

        function simulateIncoming() {
            const alias = document.getElementById('cryptoAlias').value;
            if(!alias) {
                alert("Genera un alias primero para recibir una simulación.");
                return;
            }

            document.getElementById('inboxStatus').innerText = "¡Paquete recibido!";
            document.getElementById('inboxStatus').className = "text-[10px] text-cyan-400";

            document.getElementById('inboxDisplay').innerHTML = `
                <div class="text-left w-full space-y-2 bg-zinc-900 p-3 rounded border border-zinc-800">
                    <div class="flex justify-between text-[10px] text-gray-400">
                        <span>DE: auth@secure-gateway.io</span>
                        <span class="text-red-400">LECTURA ÚNICA</span>
                    </div>
                    <p class="text-white text-xs font-bold">Token de acceso: <span class="text-yellow-400">#GP-9932-X</span></p>
                    <p class="text-[9px] text-zinc-500">Este contenido desaparecerá en cuanto recargues o generes otro alias.</p>
                </div>
            `;
        }
    </script>
</body>
    </html>
